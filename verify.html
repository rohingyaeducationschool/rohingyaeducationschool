<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificate Verification | Rohingya Education School</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f6;
}

header {
    background: #075E54;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 650px;
    margin: 30px auto;
    padding: 15px;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

h2 {
    text-align: center;
    color: #075E54;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    background: #075E54;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #128C7E;
}

#result {
    display: none;
    margin-top: 25px;
}

.verified {
    text-align: center;
    color: #128C7E;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 20px;
}

.profile {
    text-align: center;
}

.profile img {
    width: 130px;
    height: 160px;
    object-fit: cover;
    border-radius: 8px;
    border: 3px solid #075E54;
}

.details {
    margin-top: 20px;
    line-height: 1.8;
}

.details p {
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
    margin-bottom: 12px;
}

.rtl-row {
    direction: rtl;
    text-align: right;
    unicode-bidi: plaintext;
}

.rtl-label {
    font-weight: bold;
    display: inline;
}

.rtl-value {
    display: inline;
    margin-right: 8px;
}

.error {
    display: none;
    color: #d32f2f;
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

</style>
</head>

<body>

<header>
    <h1>Rohingya Education School</h1>
    <p>Certificate Verification</p>
</header>

<div class="container">

<div class="box">

<h2>Verify Certificate</h2>

<p>Enter the Certificate Code:</p>

<input
    type="text"
    id="certificateCode"
    placeholder="Enter Certificate Code"
>

<button onclick="verifyCertificate()">
    Verify Certificate
</button>

<div id="error" class="error">
    Certificate Not Found
</div>

<div id="result">

    <!-- TEXT ABOVE PHOTO -->
    <div class="verified">
        𐴏𐴡𐴀𐴞
    </div>

    <div class="profile">
        <img id="studentPhoto" src="" alt="Student Photo">
    </div>

    <div class="details">

        <!-- CERTIFICATE NUMBER -->
        <p class="rtl-row">
            <span class="rtl-label">
                𐴏𐴡𐴤𐴕𐴡𐴃𐴢 𐴑𐴟𐴀𐴋:
            </span>

            <span class="rtl-value" id="code"></span>
        </p>

        <!-- NAME -->
        <p class="rtl-row">
            <span class="rtl-label">
                𐴕𐴝𐴔:
            </span>

            <span class="rtl-value" id="name"></span>
        </p>

        <!-- FATHER NAME -->
        <p class="rtl-row">
            <span class="rtl-label">
                𐴁𐴝𐴉𐴡𐴌 𐴕𐴝𐴔:
            </span>

            <span class="rtl-value" id="father"></span>
        </p>

        <!-- DATE OF BIRTH / AGE -->
        <p class="rtl-row">
            <span class="rtl-label">
                𐴎𐴡𐴌𐴔𐴡:
            </span>

            <span class="rtl-value" id="dateOfBirth"></span>
        </p>

        <!-- PRESENT ADDRESS -->
        <p class="rtl-row">
            <span class="rtl-label">
                𐴀𐴠𐴈𐴡𐴕𐴡𐴥𐴌 𐴄𐴞𐴑𐴝𐴕𐴝𐴤:
            </span>

            <span class="rtl-value" id="presentAddress"></span>
        </p>

        <!-- PERMANENT ADDRESS -->
        <p class="rtl-row">
            <span class="rtl-label">
                𐴇𐴠𐴏𐴃𐴝𐴘𐴀𐴞 𐴄𐴞𐴑𐴝𐴕𐴝𐴤:
            </span>

            <span class="rtl-value" id="permanentAddress"></span>
        </p>

        <!-- LEVEL -->
        <p class="rtl-row">
            <span class="rtl-label">
                𐴇𐴝𐴦𐴓𐴡𐴥𐴃𐴢:
            </span>

            <span class="rtl-value">
                𐴇𐴝𐴦𐴓𐴡𐴥𐴃𐴢
            </span>
        </p>

    </div>

</div>

</div>
</div>

<script src="certificates.js"></script>

<script>

function verifyCertificate() {

    const code =
        document.getElementById("certificateCode").value.trim();

    const result =
        document.getElementById("result");

    const error =
        document.getElementById("error");

    result.style.display = "none";
    error.style.display = "none";

    if (certificates[code]) {

        const student = certificates[code];

        /*
         * The database still uses:
         * 020250125
         *
         * Only the number DISPLAYED on the page
         * is changed to Rohingya Script.
         */
        document.getElementById("code").textContent =
            "𐴰𐴲𐴰𐴲𐴵𐴰𐴱𐴲𐴵";

        document.getElementById("name").textContent =
            student.name || "";

        document.getElementById("father").textContent =
            student.father || "";

        document.getElementById("dateOfBirth").textContent =
            student.dateOfBirth || "";

        document.getElementById("presentAddress").textContent =
            student.presentAddress || "";

        document.getElementById("permanentAddress").textContent =
            student.permanentAddress || "";

        document.getElementById("studentPhoto").src =
            student.photo || "";

        result.style.display = "block";

    } else {

        error.style.display = "block";

    }
}


/* ================================
   QR CODE AUTO VERIFICATION
   ================================ */

window.addEventListener("DOMContentLoaded", function () {

    const urlParams =
        new URLSearchParams(window.location.search);

    const qrCode =
        urlParams.get("code");

    if (qrCode) {

        document.getElementById("certificateCode").value =
            qrCode;

        verifyCertificate();

    }

});

</script>

</body>
</html>
