<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate Verification</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #075E54;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .verification {
            background: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .valid {
            color: #128C7E;
            font-size: 24px;
            font-weight: bold;
        }

        .details {
            text-align: left;
            line-height: 1.8;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Rohingya Education School</h1>
        <h2>Certificate Verification</h2>
    </header>

    <div class="verification">

        <div class="valid">
            ✓ Certificate Verified
        </div>

        <div class="details">

            <p>
                <strong>Student Name:</strong>
                Mohammed Ali
            </p>

            <p>
                <strong>Certificate ID:</strong>
                RES-CERT-2026-001
            </p>

            <p>
                <strong>Course:</strong>
                FIDE EDU Preparation of Teachers Course
            </p>

            <p>
                <strong>Date of Completion:</strong>
                27 August 2026
            </p>

            <p>
                <strong>Status:</strong>
                Valid
            </p>

        </div>

    </div>

</body>

</html>
